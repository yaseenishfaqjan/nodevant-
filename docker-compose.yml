services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Paste your values here (or set in a .env file next to this compose file).
        NEXT_PUBLIC_LEAD_ENDPOINT: "${NEXT_PUBLIC_LEAD_ENDPOINT:-}"
        NEXT_PUBLIC_LEAD_ACCESS_KEY: "${NEXT_PUBLIC_LEAD_ACCESS_KEY:-}"
        NEXT_PUBLIC_CAL_LINK: "${NEXT_PUBLIC_CAL_LINK:-nodevant/strategy-call}"
        NEXT_PUBLIC_GSC_TOKEN: "${NEXT_PUBLIC_GSC_TOKEN:-}"
    image: nodevant-web:latest
    container_name: nodevant-web
    restart: unless-stopped
    ports:
      # host:container — Nodevant is served at http://localhost:3001 locally.
      # On the VPS, put a reverse proxy (Nginx/Caddy/Traefik) in front for
      # TLS + nodevant.com routing to this container's port 80.
      - "3001:80"
