# VPS overlay — run Nodevant BEHIND an existing nginx reverse proxy that already
# owns ports 80/443 (e.g. scalaro-nginx). The external proxy forwards
# nodevant.com -> nodevant-web; nodevant-web's own nginx forwards /api ->
# nodevant-api. db + api are never published to the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# Requires the external network the proxy is on (default: scalaro-net).
services:
  web:
    ports: !reset []
    networks:
      - nodevant-net
      - proxy

  api:
    ports: !reset []

networks:
  proxy:
    external: true
    name: scalaro-net
