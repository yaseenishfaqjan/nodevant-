server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Long cache for hashed static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache other static files moderately
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Next.js static export uses trailingSlash: true -> /path/ => /path/index.html
    # Fall back to a real 404 (not the homepage) so unknown routes aren't soft-404s.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Serve the exported 404 page for unknown routes
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
