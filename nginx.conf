server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Next static export uses trailingSlash. A request for /pricing (no slash)
    # makes try_files issue a redirect once it finds the /pricing/ directory.
    # absolute_redirect defaults ON, so that Location is an absolute URL built
    # from this server's scheme — http:// — because TLS is terminated on the
    # outer VPS proxy, not here. The outer proxy then mishandles that http
    # redirect and returns 500. Relative Location (/pricing/) stays on whatever
    # scheme the browser already used. Plain http:// → https:// is the outer
    # proxy's job; see DEPLOY.md. Do not add HSTS on this HTTP-only server.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Long cache for hashed static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache other static files moderately
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy API calls to the backend container (same origin -> no CORS).
    # Uses the Docker DNS resolver + variable so nginx still starts if the
    # api container is briefly down (returns 502; the frontend degrades safely).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream nodevant-api;
        proxy_pass http://$api_upstream:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js static export uses trailingSlash: true -> /path/ => /path/index.html
    # Fall back to a real 404 (not the homepage) so unknown routes aren't soft-404s.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Serve the exported 404 page for unknown routes
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
